name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      # Runs both the Mockito unit tests and the Testcontainers integration
      # tests — the runner has a Docker daemon, unlike the sandbox this was
      # developed in, so this is the first time these actually execute.
      - run: ./mvnw -B verify

  build-push-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/adez90/flowkeeper-api:latest
            ghcr.io/adez90/flowkeeper-api:${{ github.sha }}

      # Deploys straight to the shared staging server. There's only one
      # environment right now — see flowkeeper-infra's DEPLOYMENT.md — so
      # every merge to main goes live there immediately.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh "$SSH_USER@$SSH_HOST" '
            cd /opt/flowkeeper &&
            docker compose -f docker-compose.prod.yml pull api &&
            docker compose -f docker-compose.prod.yml up -d api
          '

spring:
  application:
    name: flowkeeper-api
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowkeeper}
    username: ${DB_USERNAME:flowkeeper}
    password: ${DB_PASSWORD:change-me}
  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway migrations, never by Hibernate — this only
      # verifies the mapped entities match what the migrations produced.
      ddl-auto: validate
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # 8082, not 8081 — that's Expo's Metro dev server default port,
          # which flowkeeper-mobile will also be running locally.
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8082/realms/flowkeeper}
  mail:
    # No real relay configured by default — an email notification attempt
    # just fails and is logged (see EmailNotificationSender) until a real
    # SMTP relay (SendGrid, SES, Mailgun, ...) is set via these env vars in
    # flowkeeper-infra's environment.
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

app:
  cors:
    # The web app's origin — a different subdomain in every real
    # deployment, so the browser enforces CORS. Vite's default dev port
    # locally.
    allowed-origin: ${APP_ORIGIN:http://localhost:5173}
  notifications:
    from-email: ${NOTIFICATIONS_FROM_EMAIL:noreply@flowkeeper.se}
  avatars:
    # A disk volume mounted into the API container in production
    # (flowkeeper-infra); a plain relative directory locally, created on
    # startup if missing.
    storage-dir: ${AVATAR_STORAGE_DIR:./data/avatars}
  admin:
    # Comma-separated allowlist of FlowKeeper account emails allowed to
    # use the platform-admin endpoints (currently: generating promo
    # codes). Empty by default — nobody can until this is set. See
    # PlatformAdmins.
    emails: ${ADMIN_EMAILS:}
  billing:
    stripe:
      # Both blank by default — no real billing until flowkeeper-infra's
      # environment sets these. A blank secret-key makes checkout-session
      # creation fail clearly (503) instead of calling Stripe with an
      # empty key; a blank webhook-secret does the same for incoming
      # webhook deliveries. See StripeGateway.
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  integrations:
    # This API's own public base URL — distinct from app.cors.allowed-origin
    # (the web app's origin). Providers redirect the browser back to
    # {api-origin}/api/v1/integrations/oauth/{provider}/callback, which
    # then redirects on to the web app itself.
    api-origin: ${API_ORIGIN:http://localhost:8080}
    google:
      # Blank by default — Google Calendar stays unavailable
      # (GET /api/v1/integrations/providers reports it as such) until both
      # are set. See GoogleCalendarGateway.
      client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
      client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    microsoft:
      client-id: ${MICROSOFT_CALENDAR_CLIENT_ID:}
      client-secret: ${MICROSOFT_CALENDAR_CLIENT_SECRET:}
    strava:
      client-id: ${STRAVA_CLIENT_ID:}
      client-secret: ${STRAVA_CLIENT_SECRET:}
    apple:
      # No client id/secret to configure — Apple Calendar has no working
      # gateway yet (see ExternalProvider), so this stays false regardless.
      enabled: ${APPLE_CALENDAR_ENABLED:false}

server:
  port: 8080
  # Caddy terminates TLS and reverse-proxies to this container over plain
  # HTTP, forwarding X-Forwarded-Proto/Host — without this, the avatar
  # upload endpoint would build "http://" URLs behind an https:// domain.
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: WARN
    # Our own code: business-relevant events at INFO (a user registered, an
    # event completed), detail at DEBUG. Raise se.flowkeeper to DEBUG when
    # running locally, not by lowering the root level.
    se.flowkeeper: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
